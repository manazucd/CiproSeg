# -----------------------------------------------------------------------
#  Config G -- Dice+BCE with regularisation on patch=256 baseline
#
#  Goal: test dropout + GroupNorm without the patch=384 confound.
#  Changes from Config F: dropout=0.2, GroupNorm instead of BatchNorm.
# -----------------------------------------------------------------------

dataset:
  name: ciproseg_ecoli
  root: "/cta/users/miray.palaz/CiproSeg/dataset_18-03-2026"
  train_frac: 0.8
  patch: 256
  stride: 128

model:
  name: unet4
  in_channels: 1
  out_channels: 1
  base_channels: 64
  dropout_p: 0.2
  norm: group

trainer:
  epochs: 500
  batch_size: 8
  num_workers: 4
  seed: 1234
  target_patches_per_epoch: 2000

  deterministic: false
  benchmark: true

  cpu: false
  output_dir: "runs/config_G"

  amp: true
  early_stop_patience: 500
  test_tta: false
  compute_object_metrics: true

validation:
  checkpoint_threshold: 0.5
  threshold_sweep: true
  sweeping_thresholds: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60]

loss:
  name: dice_bce
  dice_weight: 0.5
  bce_weight: 0.5

optim:
  name: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-2

sched:
  name: cosine
  tmax: 500
  warmup_epochs: 10

logger:
  name: ciproseg
  level: INFO
