dataset:
  name: ciproseg_ecoli
  root: "/path/to/your/Data/original_size"
  train_frac: 0.8         
  patch: 256              
  stride: 128             

model:
  name: unet4             
  in_channels: 1          
  out_channels: 1         
  base_channels: 64       

trainer:
  epochs: 500             
  batch_size: 8           
  num_workers: 4          
  seed: 1234              
  thr: 0.5                
  target_patches_per_epoch: 2000  

  deterministic: false    
  benchmark: true         

  cpu: false              
  output_dir: "runs"      

optim:
  name: adamw             
  lr: 3.0e-4                                       
  weight_decay: 1.0e-2    
                         
sched:
  name: cosine            
  tmax: 500               
                      
logger:
  name: ciproseg
  level: INFO
  