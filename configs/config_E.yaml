dataset:
  name: ciproseg_ecoli
  root: "/cta/users/miray.palaz/CiproSeg/dataset_18-03-2026"
  train_frac: 0.8
  patch: 384
  stride: 192

model:
  name: unet4
  in_channels: 1
  out_channels: 1
  base_channels: 64
  dropout_p: 0.2
  norm: group

trainer:
  epochs: 500
  batch_size: 4
  num_workers: 4
  seed: 1234
  thr: 0.5
  target_patches_per_epoch: 1500

  deterministic: false
  benchmark: true

  cpu: false
  output_dir: "runs/config_E"

  amp: true
  early_stop_patience: 100
  threshold_sweep: true
  test_tta: true
  compute_object_metrics: true

loss:
  name: tversky
  alpha: 0.3
  beta: 0.7
  smooth: 1.0

optim:
  name: adamw
  lr: 2.0e-4
  weight_decay: 1.0e-2

sched:
  name: cosine
  tmax: 500
  warmup_epochs: 10

logger:
  name: ciproseg
  level: INFO
